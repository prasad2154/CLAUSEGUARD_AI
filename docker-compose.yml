services:
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: clauseguard_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - /app/__pycache__
      - clauseguard_uploads:/app/uploads
    environment:
      - DATABASE_URL=postgresql://clauseguard:clauseguard@postgres:5432/clauseguard
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - LLM_PROVIDER=${LLM_PROVIDER:-openai}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com/v1}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o-mini}
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-prod}
      - DEBUG=True
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health\")'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - clauseguard_network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: clauseguard_frontend
    ports:
      - "80:80"
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - clauseguard_network
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: clauseguard_postgres
    environment:
      - POSTGRES_USER=clauseguard
      - POSTGRES_PASSWORD=clauseguard
      - POSTGRES_DB=clauseguard
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clauseguard -d clauseguard"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - clauseguard_network
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: clauseguard_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/localhost/6333'"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - clauseguard_network
    restart: unless-stopped

networks:
  clauseguard_network:
    driver: bridge

volumes:
  postgres_data:
  qdrant_data:
  clauseguard_uploads:
